name: souls_game
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.33.0
  bonfire: ^3.16.1
  flame_audio: ^2.11.11
  flame_tiled: ^1.21.2
